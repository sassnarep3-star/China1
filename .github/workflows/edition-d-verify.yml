name: Verify Edition D and all prior editions
on:
  pull_request:
  push:
    branches: [main, 'arena/e58c83ae-china1']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo audit is a point-in-time snapshot of tracked files; it is
      # regenerated manually (build/audit.py) and committed. CI verifies the
      # build against the committed snapshot rather than re-scanning a moving
      # worktree, so shared-file updates do not break the build diff.
      - name: Edition D build is reproducible and verified
        run: |
          python3 edition-d/build/build.py
          git diff --exit-code -- edition-d/docs edition-d/data/costs.json
          python3 edition-d/build/verify.py
      - name: Original dashboard checks
        run: python3 assets/check.py
      - name: Dossier build reproducible
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- dossier data
      - name: Supplemental dashboard build reproducible
        run: |
          python3 scripts/build.py
          python3 scripts/verify.py
          git diff --exit-code -- docs
      - name: Edition B build reproducible and verified
        run: |
          python3 edition-b/build/generate.py
          git diff --exit-code -- edition-b
          python3 edition-b/build/verify.py
      - name: Edition C build reproducible and verified
        run: |
          python3 edition-c/build/build.py
          git diff --exit-code -- edition-c/docs
          python3 edition-c/build/linkcheck.py
