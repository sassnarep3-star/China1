name: Verify static site
on:
  pull_request:
  push:
    branches: [main, 'arena/e6269551-china1', 'arena/3e9a7b87-china1']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated pages, citations, and local links
        run: python3 assets/check.py
      - name: Verify dossier build is reproducible and internally linked
        run: |
          python3 scripts/build_site.py
          git diff --exit-code -- dossier data
      - name: Verify supplemental dashboard
        run: |
          python3 scripts/build.py
          python3 scripts/verify.py
          git diff --exit-code -- docs
      - name: Verify edition-b build is reproducible and every value is sourced
        run: |
          python3 edition-b/build/generate.py
          git diff --exit-code -- edition-b
          python3 edition-b/build/verify.py
      - name: Verify edition-c build is reproducible, citations resolve, and no blank is undisclosed
        run: |
          python3 edition-c/build/build.py
          git diff --exit-code -- edition-c/docs
          python3 edition-c/build/linkcheck.py

  edition-d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Edition D is reproducible and every figure is sourced
        run: |
          python3 edition-d/build/build.py
          git diff --exit-code -- edition-d/docs index.html
          python3 edition-d/build/verify.py
