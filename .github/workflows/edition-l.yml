name: edition-l

on:
  push:
    paths: ["edition-l/**", ".github/workflows/edition-l.yml"]
  pull_request:
    paths: ["edition-l/**", ".github/workflows/edition-l.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Edition L site and data
        run: python3 edition-l/build/build.py
      - name: Verify Edition L (independent arithmetic, citations, blanks, links, determinism)
        run: python3 edition-l/build/verify.py
      - name: Confirm the consolidated portal still verifies
        run: python3 integration/verify.py
