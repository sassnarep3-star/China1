name: edition-abd04d5f
on:
  pull_request:
    paths:
      - 'edition-abd04d5f/**'
      - '.github/workflows/edition-abd04d5f.yml'
  push:
    branches: [main]
    paths:
      - 'edition-abd04d5f/**'
      - '.github/workflows/edition-abd04d5f.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild
        run: python3 edition-abd04d5f/build/build.py
      - name: Generated files are committed
        run: git diff --exit-code -- edition-abd04d5f
      - name: Verify
        run: python3 edition-abd04d5f/build/verify.py
